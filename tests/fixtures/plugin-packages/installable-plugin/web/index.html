<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Notes</title><style>:root{font-family:Inter,"Segoe UI",sans-serif;color:#1b1f24;background:#f7f8fa;color-scheme:light}body{display:grid;place-items:center;min-height:100vh;margin:0}.state{max-width:480px;padding:24px;border-left:3px solid #2563a6}h1{font-size:20px}p{color:#66707a;line-height:1.5}:root[data-theme=dark]{color:#f1f3f5;background:#15171a;color-scheme:dark}:root[data-theme=dark] p{color:#aab2bb}</style></head><body><div class="state"><h1>Reading Notes</h1><p>This compatible local package was copied, enabled, activated, and routed by Infolens.</p></div><script>const p=new URLSearchParams(location.search);const apply=t=>document.documentElement.dataset.theme=t==="dark"?"dark":"light";apply(p.get("theme"));addEventListener("message",e=>{if(e.data?.type==="infolens:theme")apply(e.data.theme)})</script></body></html>
