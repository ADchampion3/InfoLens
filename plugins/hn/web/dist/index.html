<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Hacker News 热门文章</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="workspace">
      <header class="workspace-header">
        <div class="workspace-title">
          <h1>Hacker News</h1>
          <span class="refresh-time" id="refresh-time">正在加载保留内容...</span>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="刷新 Hacker News" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="打开刷新设置" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34A1.7 1.7 0 0 0 14 20.9V21h-4v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>
      <main>
        <ol class="story-list" id="story-list" aria-live="polite">
          <li class="loading-row">正在加载保留内容...</li>
        </ol>
        <div class="error-state" id="error-state" hidden>
          <h2>内容暂不可用</h2>
          <p>插件 API 未能返回保留内容。</p>
        </div>
      </main>
    </div>
    <script type="module" src="./workspace.js"></script>
  </body>
</html>
