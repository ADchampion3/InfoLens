<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GitHub Trending</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./source-board.css">
</head>
<body>
  <div class="workspace">
    <header class="workspace-header">
      <div class="workspace-title"><span class="source-mark" aria-hidden="true">GH</span><div class="title-copy"><h1>GitHub Trending</h1><span id="refresh-time" class="refresh-time">正在读取保留内容...</span></div></div>
      <div class="header-actions"><button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新 GitHub Trending"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg></button><button id="settings" class="icon-button" type="button" title="刷新设置" aria-label="打开刷新设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-2.83 2.83a1.7 1.7 0 0 0-1.88-.34A1.7 1.7 0 0 0 14 20.9h-4A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-2.83-2.83A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14v-4A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l2.83-2.83A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08h4A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l2.83 2.83A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10v4A1.7 1.7 0 0 0 19.4 15Z"/></svg></button></div>
    </header>
    <div class="toolbar" aria-label="趋势筛选"><label><span>周期</span><select id="period"><option value="daily">今日</option><option value="weekly">本周</option><option value="monthly">本月</option></select></label><label><span>语言</span><select id="language"><option value="all">全部语言</option><option>TypeScript</option><option>Python</option><option>Rust</option><option>Go</option><option>C++</option></select></label></div>
    <div id="warning" class="warning" role="alert" hidden><span><strong>刷新失败。</strong> 当前显示上次成功保留的内容。</span><button id="retry" type="button">重试</button></div>
    <main><ol id="repo-list" class="repo-list" aria-live="polite"><li class="loading">正在读取保留内容...</li></ol><section id="empty" class="empty" hidden><span class="state-mark" aria-hidden="true">GH</span><h2>还没有趋势仓库</h2><p>选择周期和语言，然后执行首次刷新。</p><button id="empty-refresh" class="primary" type="button">立即刷新</button></section></main>
  </div>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="settings-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><header><div><h2 id="settings-title">刷新设置</h2><p>控制此信息源何时更新</p></div><button id="close-settings" class="icon-button" type="button" aria-label="关闭设置">×</button></header><form id="settings-form"><fieldset><legend>刷新策略</legend><label><input type="radio" name="policy" value="manual"><span>仅手动</span></label><label><input type="radio" name="policy" value="disabled"><span>停用刷新</span></label><label><input type="radio" name="policy" value="fixed"><span>固定间隔</span></label></fieldset><label class="select-field" for="interval">刷新间隔</label><select id="interval" name="intervalMinutes"><option value="15">每 15 分钟</option><option value="30">每 30 分钟</option><option value="60">每小时</option><option value="360">每 6 小时</option><option value="720">每 12 小时</option><option value="1440">每天</option></select><div class="sheet-actions"><button id="cancel-settings" type="button">取消</button><button class="primary" type="submit">保存</button></div></form></aside>

  <aside id="readme-sheet" class="readme-sheet" role="dialog" aria-modal="true" aria-labelledby="readme-title" hidden>
    <header class="readme-head"><div><p id="readme-owner">GitHub 仓库</p><h2 id="readme-title">README</h2></div><div class="readme-head-actions"><button id="open-github" class="icon-button" type="button" title="在 GitHub 打开" aria-label="在 GitHub 打开"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></button><button id="close-readme" class="icon-button" type="button" aria-label="关闭 README">×</button></div></header>
    <div class="readme-toolbar"><span id="readme-status">正在抓取 README...</span><button id="reload-readme" class="secondary" type="button">重新抓取</button></div>
    <div id="readme-loading" class="readme-state" role="status">正在从 GitHub 抓取 README...</div>
    <div id="readme-error" class="readme-state readme-error" role="alert" hidden><strong>无法显示 README</strong><p id="readme-error-message"></p><button id="retry-readme" class="secondary" type="button">重试</button></div>
    <article id="readme-content" class="readme-content" aria-label="仓库 README 内容" hidden></article>
  </aside>
  <script type="module" src="./source-board.js"></script>
</body>
</html>
